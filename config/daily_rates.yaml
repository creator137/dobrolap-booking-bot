# Цены на размещение (матрица тариф × вид питомца × размер × возраст × сезон).
# Этот файл перезаписывается полностью при импорте через /prices в боте
# (owner.py → price_admin.py) — ручные правки переживут импорт только до
# следующего /prices. Чтобы поправить вручную, отредактируйте и перезапустите
# бота, либо выгрузите /prices → поправьте в Excel → отправьте файл обратно.
#
# unavailable: true — тариф для этого вида/размера питомца не предлагается.
# price_rub_season / price_from_rub_season / price_to_rub_season — сезон
# отпусков и праздников; применяется, когда заезд попадает в период из
# price_rules.yaml: season_periods.


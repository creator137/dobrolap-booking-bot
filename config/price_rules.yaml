# Editable promotional / seasonal rules. Do not hardcode campaigns in Python.

deposit:
  base_rub: 2000
  extra_pet_rub: 500

price_rules:
  - id: dobrolapki_first_stay_2026
    # Сочетание не более двух акций; окончательную сумму утверждает оператор.
    scope: discount
    date_to: 2026-11-01
    condition:
      promo_code: "ДОБРОЛАПКИ"
      applies_to: accommodation
      first_placement: true
      max_uses_per_customer: 1
    percent: 5
    priority: 1
    stackable: true
    active: true
    description: "ДОБРОЛАПКИ: 5% на первое размещение, до 01.11.2026 включительно"

  # Подтверждённые владельцем проценты при размещении от 30 суток.
  - id: long_stay_vip_2026
    scope: discount
    condition: {min_nights: 30, tariff_kinds: [vip, vip_plus], applies_to: accommodation}
    percent: 20
    priority: 20
    stackable: true
    active: true
    description: "От 30 суток: VIP и VIP+ — 20%"
  - id: long_stay_comfort_2026
    scope: discount
    condition: {min_nights: 30, tariff_kinds: [comfort, comfort_plus], applies_to: accommodation}
    percent: 15
    priority: 20
    stackable: true
    active: true
    description: "От 30 суток: Комфорт и Комфорт+ — 15%"
  - id: long_stay_outdoor_2026
    scope: discount
    condition: {min_nights: 30, tariff_kinds: [outdoor_comfort], applies_to: accommodation}
    percent: 10
    priority: 20
    stackable: true
    active: true
    description: "От 30 суток: уличный вольер — 10%"
  - id: long_stay_cage_economy_2026
    scope: discount
    condition: {min_nights: 30, tariff_kinds: [premium, standard_l, standard_m, optimal_s, economy], applies_to: accommodation}
    percent: 5
    priority: 20
    stackable: true
    active: true
    description: "От 30 суток: клетка, вольер или Эконом — 5%"

  - id: promo_5pct_2026
    scope: discount
    date_from: 2026-01-01
    date_to: 2026-11-01
    condition:
      promo_code: "DOBROLAP5"  # placeholder code name — replace when owner confirms
      applies_to: accommodation
    percent: 5
    priority: 10
    stackable: false
    active: false  # placeholder code — enable only after owner confirms real promo code
    description: "Временная акция 5% на проживание, однократно, не суммируется (до 2026-11-01)"

  # Holidays / early booking — placeholders, inactive until owner provides numbers
  - id: holiday_placeholder
    scope: surcharge
    condition:
      tag: holiday
    percent: null
    amount_rub: null
    priority: 50
    stackable: true
    active: false
    description: "Праздничный тариф — даты и коэффициент уточнить"

  - id: early_booking_placeholder
    scope: discount
    condition:
      min_days_before_checkin: null
    percent: null
    priority: 40
    stackable: false
    active: false
    description: "Скидка за раннее бронирование — условия уточнить"
